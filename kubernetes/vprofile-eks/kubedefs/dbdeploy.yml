apiVersion: apps/v1
kind: Deployment
metadata:
  name: vprodb
  labels:
    app: vprodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vprodb
  template:
    metadata:
      labels:
        app: vprodb
    spec:
      containers:
      - name: vprodb
      #public image hosted in Docker Hub
        image: jacegonzales25/vprofiledb
        volumeMounts:
        - mountPath: /var/lib/mysql
          name: vpro-db-data  
        ports:
        - name: vprodb-port
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
          #Taken from secret.yml must be ecryption
            secretKeyRef:
              name: app-secret
              key: db-pass 
      volumes:
        - name: vpro-db-data
          persistentVolumeClaim:
            claimName: db-pv-claim
#init container to remove lost+found directory
      initContainers:
        - name: busybox
          image: busybox:latest
          args: ["rm", "-rf", "/var/lib/mysql/lost+found"] 
          volumeMounts:
            - name: vpro-db-data
              mountPath: /var/lib/mysql